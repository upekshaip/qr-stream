# Publishes @upekshaip/qr-stream to GitHub Packages (private registry).
#
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
# GITHUB_TOKEN is enough — same-owner publishes need no PAT.
name: Publish to GitHub Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install
        run: npm ci

      # prepublishOnly runs the build + full test suite before publishing.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
