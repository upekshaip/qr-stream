# Publishes @upekshaip/qr-stream to both registries from one tag.
#
# Trigger: push a tag like v0.1.2, or run manually from the Actions tab.
#
#   npmjs.com       — the public home of the package. Needs an automation
#                     token in the NPM_TOKEN repo secret. The job is skipped
#                     when that secret is absent, so a release still succeeds
#                     on a clone without it rather than failing the run.
#   GitHub Packages — kept in parallel for consumers already resolving the
#                     @upekshaip scope there. GITHUB_TOKEN is enough;
#                     same-owner publishes need no PAT.
#
# Both jobs run prepublishOnly (build + full test suite) before uploading.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  npmjs:
    name: npmjs.com
    runs-on: ubuntu-latest
    # The secrets context is not available in a job-level `if`, so the token is
    # lifted into env here and the publish step is gated on it below.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Publish
        # publishConfig.access is "public", so the scoped package is published
        # publicly; --access public is passed anyway to be explicit.
        #
        # Skips when the exact name@version is already on the registry, so a
        # release published by hand (or a re-run of this workflow) does not
        # fail with E409 — the publish is idempotent rather than order-dependent.
        if: env.NPM_TOKEN != ''
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$NAME@$VER is already on npmjs — nothing to do."
          else
            npm publish --access public --registry=https://registry.npmjs.org
          fi
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Skipped
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN secret not set — npmjs publish skipped (publish that half by hand)."

  github-packages:
    name: GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install
        run: npm ci

      - name: Publish
        # Same idempotency guard as the npmjs job, so re-running the workflow
        # on an already-published tag is harmless.
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$NAME@$VER is already on GitHub Packages — nothing to do."
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
