# CI for the standalone package mirror (github.com/upekshaip/qr-stream).
# Inert inside the monorepo (nested .github); live at the mirror's root.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Node import smoke (CJS + ESM)
        run: |
          node -e "require('./dist/index.cjs')"
          node -e "import('./dist/index.js').then(m => { if (typeof m.simulateTransfer !== 'function') throw new Error('missing export'); })"

      - name: Pack dry-run (tarball contents)
        run: npm pack --dry-run
